name: build-site
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이슈를 JSON으로 내보내기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh issue list --author ${{ github.repository_owner }} --state all --limit 1000 \
            --json number,title,body,labels,createdAt,updatedAt > site/notes.json
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
